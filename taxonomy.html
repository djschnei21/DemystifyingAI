<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Mechanical Agentic Taxonomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Source+Serif+4:opsz,wght@8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<style>
  :root {
    --bg: #FAF7F1;
    --bg-deep: #F2EDE3;
    --text: #1C1A17;
    --text-muted: #76706A;
    --text-subtle: #A39C92;
    --accent: #7A2E1E;
    --accent-soft: #B0584A;
    --rule: #DDD5C8;
    --rule-soft: #EAE4D8;
    --code-bg: #F2ECE0;
    --pre-bg: #221E19;
    --pre-text: #F8F1E8;
    --pre-muted: #B8AEA1;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Source Serif 4', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    --measure: 45rem;
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.7;
    font-feature-settings: "onum" 1, "kern" 1, "liga" 1;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* Subtle paper grain */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* Layout */
  .page {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 1fr) min(var(--measure), 100% - 3rem) minmax(0, 1fr);
    padding: 4.5rem 0 8rem;
  }
  .page > * { grid-column: 2; }
  .loading,
  .load-error {
    font-family: var(--font-display);
    color: var(--text-muted);
    text-align: center;
  }

  .site-links {
    position: absolute;
    top: 1.1rem;
    right: 1.4rem;
    z-index: 20;
    display: flex;
    gap: 0.85rem;
    font-family: var(--font-display);
    font-size: 0.67rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .site-links a {
    color: var(--text-muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .site-links a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent-soft);
  }

  /* Sticky TOC sidebar - desktop only */
  .toc {
    position: fixed;
    top: 4.5rem;
    left: 2rem;
    z-index: 10;
    width: 13.5rem;
    font-family: var(--font-display);
    font-size: 0.78rem;
    line-height: 1.55;
    letter-spacing: 0.04em;
    font-feature-settings: "smcp" 1;
    color: var(--text-muted);
    display: none;
  }
  .toc-label {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-subtle);
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }
  .toc ol {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .toc li::before {
    content: none;
    display: none;
  }
  .toc li.toc-entry {
    margin: 0.6rem 0;
    position: relative;
    padding-left: 2.8rem;
    line-height: 1.4;
  }
  .toc li.toc-meta-entry {
    padding-left: 0;
  }
  .toc-num {
    position: absolute;
    left: 0;
    width: 2.2rem;
    text-align: right;
    color: var(--text-subtle);
    font-feature-settings: "lnum" 1;
    font-style: italic;
    font-weight: 400;
  }
  .toc li.toc-preamble {
    padding-left: 0;
  }
  .toc li.toc-group {
    counter-increment: none;
    margin: 1rem 0 0.8rem;
    padding-left: 0;
  }
  .toc li.toc-group::before {
    content: none;
    display: none;
  }
  .toc-group-label {
    display: block;
    margin: 0 0 0.45rem;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-subtle);
  }
  .toc a {
    display: block;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
    border-bottom: 0;
  }
  .toc a:hover {
    color: var(--accent);
    border-bottom: 0;
  }
  .toc a.active {
    color: var(--text);
  }

  @media (min-width: 1180px) {
    .toc { display: block; }
  }

  @media (max-width: 760px) {
    .site-links { display: none; }
  }

  /* Masthead */
  .masthead {
    text-align: center;
    margin-bottom: 5rem;
    animation: fade-up 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 2.5rem;
    font-weight: 400;
  }
  .eyebrow .dot {
    display: inline-block;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    vertical-align: middle;
    margin: 0 0.85em;
    transform: translateY(-1px);
  }
  h1.title {
    font-family: var(--font-display);
    font-size: clamp(2.75rem, 6vw, 4rem);
    font-weight: 380;
    font-style: normal;
    font-variation-settings: "opsz" 144, "SOFT" 50;
    line-height: 1;
    letter-spacing: -0.022em;
    margin: 0 0 1.5rem;
    color: var(--text);
    text-wrap: balance;
  }
  h1.title em {
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100;
    color: var(--accent);
  }
  .byline {
    font-family: var(--font-display);
    font-size: 0.8rem;
    font-style: italic;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 1.7rem;
  }
  .subtitle {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--text-muted);
    max-width: 30rem;
    margin: 0 auto;
    line-height: 1.5;
  }
  .title-rule {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 3rem auto 0;
    width: 8rem;
  }
  .title-rule::before,
  .title-rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .title-rule .ornament {
    width: 5px;
    height: 5px;
    background: var(--accent);
    margin: 0 0.85rem;
    transform: rotate(45deg);
  }
  .audio-widget {
    max-width: 30rem;
    margin: 0.25rem auto 0;
    --plyr-color-main: var(--accent);
    --plyr-audio-controls-background: color-mix(in srgb, var(--bg-deep) 78%, transparent);
    --plyr-audio-control-color: var(--text);
    --plyr-audio-control-color-hover: var(--bg);
    --plyr-control-radius: 999px;
    --plyr-range-track-height: 3px;
    --plyr-range-thumb-height: 11px;
    --plyr-font-family: var(--font-display);
    --plyr-font-size-time: 0.74rem;
  }
  .audio-kicker {
    margin: 0 0 0.55rem;
    color: var(--text-muted);
    font-family: var(--font-display);
    font-size: 0.86rem;
    font-style: italic;
    line-height: 1.35;
  }
  .audio-widget .plyr {
    border: 1px solid var(--rule);
    border-radius: 999px;
    box-shadow: none;
  }
  .audio-widget .plyr--audio .plyr__controls {
    border-radius: 999px;
    padding: 0.55rem 0.7rem;
  }
  .audio-widget .plyr__control {
    color: var(--text);
  }
  .audio-widget .plyr__control:hover,
  .audio-widget .plyr__control[aria-expanded="true"] {
    background: var(--accent);
    color: var(--bg);
  }
  .audio-widget .plyr__time {
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  /* Section structure */
  section {
    margin-bottom: 4rem;
    animation: fade-up 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  section:nth-child(n+3) { animation-delay: 0.05s; }

  h2 {
    font-family: var(--font-display);
    font-size: 1.85rem;
    font-weight: 480;
    font-variation-settings: "opsz" 72, "SOFT" 30;
    letter-spacing: -0.012em;
    line-height: 1.15;
    margin: 0 0 1.5rem;
    color: var(--text);
    position: relative;
  }
  h2 .num {
    display: block;
    font-family: var(--font-display);
    font-size: 0.7rem;
    font-weight: 400;
    font-style: italic;
    font-variation-settings: "opsz" 9;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.7rem;
    font-feature-settings: "lnum" 1;
  }

  p {
    margin: 0 0 1.25rem;
    hanging-punctuation: first last;
  }
  p:last-child { margin-bottom: 0; }

  /* Normalize inter-section spacing regardless of what element ends the section */
  section > *:last-child { margin-bottom: 0; }

  .definition-card {
    margin: 0 0 1.8rem;
    padding: 1.15rem 1.35rem 1.25rem;
    background: var(--bg-deep);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
  }
  .definition-card .definition-label {
    display: block;
    margin-bottom: 0.45rem;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 0.66rem;
    font-style: normal;
    font-feature-settings: "smcp" 1, "lnum" 1;
    letter-spacing: 0.2em;
    line-height: 1;
    text-transform: uppercase;
  }
  .definition-card p {
    margin: 0;
    color: var(--text);
    font-size: 1.02rem;
    font-style: italic;
    line-height: 1.6;
  }

  .examples-card {
    margin: 0 0 1.9rem;
    padding: 1.15rem 1.35rem 1.2rem;
    background: rgba(176, 88, 74, 0.08);
    border: 1px solid var(--rule-soft);
  }
  .examples-card .examples-label {
    display: block;
    margin-bottom: 0.6rem;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 0.66rem;
    font-style: italic;
    font-feature-settings: "smcp" 1, "lnum" 1;
    letter-spacing: 0.2em;
    line-height: 1;
    text-transform: uppercase;
  }
  .examples-card ul {
    margin: 0;
  }
  .examples-card li {
    margin-bottom: 0.55rem;
    font-size: 0.96rem;
    line-height: 1.55;
  }
  .examples-card li:last-child {
    margin-bottom: 0;
  }

  .diagram {
    width: 100%;
    margin: 2rem 0 2.4rem;
  }
  .diagram img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Drop cap on first paragraph of What This Document Is */
  #what-this-is > p:first-of-type::first-letter {
    font-family: var(--font-display);
    font-size: 4.2rem;
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 70;
    float: left;
    line-height: 0.85;
    padding: 0.35rem 0.6rem 0 0;
    color: var(--accent);
  }

  em { font-style: italic; }
  strong {
    font-weight: 600;
    color: var(--text);
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
    transition: border-color 0.2s ease;
  }
  a:hover { border-bottom-color: var(--accent); }

  /* Lists */
  ul, ol {
    margin: 0 0 1.5rem;
    padding-left: 1.4rem;
  }
  ul { list-style: none; padding-left: 0; }
  ul li {
    position: relative;
    padding-left: 1.4rem;
    margin-bottom: 0.85rem;
  }
  ul li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.85em;
    width: 0.45rem;
    height: 1px;
    background: var(--accent);
  }
  ol {
    list-style: none;
    counter-reset: ol;
    padding-left: 0;
  }
  ol li {
    counter-increment: ol;
    position: relative;
    padding-left: 2.2rem;
    margin-bottom: 0.85rem;
  }
  ol li::before {
    content: counter(ol);
    position: absolute;
    left: 0;
    top: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-variation-settings: "opsz" 14, "SOFT" 60;
    font-feature-settings: "lnum" 1;
    color: var(--accent);
    font-size: 0.95rem;
    width: 1.5rem;
    text-align: right;
  }

  /* Code blocks */
  pre {
    background: var(--pre-bg);
    border: 1px solid rgba(28, 26, 23, 0.18);
    border-top: 3px solid var(--accent);
    padding: 2.55rem 1.5rem 1.35rem;
    margin: 2.2rem 0;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--pre-text);
    border-radius: 3px;
    position: relative;
    box-shadow: 0 0.7rem 1.8rem rgba(28, 26, 23, 0.08);
  }
  pre::before {
    content: "Pseudocode";
    position: absolute;
    top: 0.85rem;
    left: 1.5rem;
    color: var(--pre-muted);
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    line-height: 1;
    text-transform: uppercase;
  }
  pre .comment { color: var(--text-muted); font-style: italic; }
  pre .placeholder { color: var(--accent); }
  pre .keyword { color: var(--text); font-weight: 500; }
  pre .string { color: var(--accent-soft); }
  pre code {
    display: block;
    padding: 0;
    background: transparent;
    color: inherit;
    font-size: inherit;
    border-radius: 0;
  }

  code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 0.08em 0.35em;
    border-radius: 2px;
    color: var(--text);
  }

  /* Table */
  .table-wrap {
    margin: 2rem -1rem;
    padding: 0 1rem;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }
  thead th {
    font-family: var(--font-display);
    font-weight: 500;
    font-variation-settings: "opsz" 14;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: left;
    padding: 0.85rem 1rem 0.85rem 0;
    border-bottom: 1.5px solid var(--text);
    color: var(--text);
  }
  thead th:not(:last-child) { padding-right: 1.5rem; }
  tbody td {
    padding: 1rem 1rem 1rem 0;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    line-height: 1.5;
  }
  tbody td:not(:last-child) { padding-right: 1.5rem; }
  tbody tr:last-child td { border-bottom: 1.5px solid var(--text); }
  td:first-child, th:first-child {
    font-family: var(--font-display);
    font-weight: 500;
    font-variation-settings: "opsz" 24;
  }

  /* Block elements */
  .callout {
    margin: 2rem 0;
    padding: 1.5rem 1.75rem;
    background: var(--bg-deep);
    border-left: 2px solid var(--accent);
    font-style: italic;
    font-size: 0.98rem;
    color: var(--text);
  }
  .callout .label {
    display: block;
    font-style: normal;
    font-family: var(--font-display);
    font-size: 0.66rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
    font-feature-settings: "lnum" 1;
  }

  /* Section divider - between major parts (unused) */
  .divider {
    text-align: center;
    margin: 4rem 0;
    color: var(--text-subtle);
    font-family: var(--font-display);
    letter-spacing: 1em;
    font-size: 0.7rem;
  }

  /* Implications get special treatment */
  .implications ul li {
    padding-left: 0;
    margin-bottom: 1.5rem;
  }
  .implications ul li::before { display: none; }
  .implications ul li strong {
    display: block;
    font-family: var(--font-display);
    font-weight: 500;
    font-variation-settings: "opsz" 18;
    font-size: 1.08rem;
    color: var(--accent);
    margin-bottom: 0.35rem;
    letter-spacing: -0.005em;
  }

  /* Footer */
  footer {
    margin-top: 7rem;
    padding-top: 2.5rem;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-subtle);
  }
  footer .dot {
    display: inline-block;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    vertical-align: middle;
    margin: 0 0.85em;
    transform: translateY(-1px);
  }

  /* Animations */
  @keyframes fade-up {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Selection */
  ::selection {
    background: var(--accent);
    color: var(--bg);
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    html { scroll-behavior: auto; }
  }

  /* Print */
  @media print {
    body { background: white; }
    body::before { display: none; }
    .toc { display: none; }
    pre {
      background: #f4f4f4;
      border-color: #888;
      color: #111;
      box-shadow: none;
    }
    pre::before { color: #666; }
    pre code { color: inherit; }
  }
</style>
</head>
<body>

<nav class="site-links" aria-label="Site links">
  <a href="taxonomy-presentation.html">Presentation version</a>
</nav>

<nav class="toc" aria-label="Table of contents">
  <div class="toc-label">Contents</div>
  <ol id="toc-list"></ol>
</nav>

<div class="page">
  <header class="masthead" id="masthead"></header>
  <main id="content" aria-live="polite">
    <p class="loading">Loading taxonomy.md...</p>
  </main>
  <footer id="footer"></footer>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
  const MARKDOWN_SOURCE = 'taxonomy.md';
  const AUDIO_SOURCE = 'audio/mechanical%20agentic%20taxonomy.m4a';

  const escapeHtml = (value) => value
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

  const slugify = (value) => value
    .toLowerCase()
    .replace(/<[^>]*>/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');

  const formatWithDots = (value) => escapeHtml(value)
    .split(/\s+•\s+/)
    .join(' <span class="dot"></span> ');

  const inlineMarkdown = (value) => {
    const code = [];
    let html = escapeHtml(value).replace(/`([^`]+)`/g, (_, match) => {
      code.push(`<code>${match}</code>`);
      return `@@CODE${code.length - 1}@@`;
    });

    html = html
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<u>$1</u>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');

    return html.replace(/@@CODE(\d+)@@/g, (_, index) => code[Number(index)]);
  };

  const parseFrontMatter = (markdown) => {
    if (!markdown.startsWith('---\n')) {
      return [{}, markdown];
    }

    const end = markdown.indexOf('\n---\n', 4);
    if (end === -1) {
      return [{}, markdown];
    }

    const metadata = {};
    markdown.slice(4, end).split('\n').forEach((line) => {
      const separator = line.indexOf(':');
      if (separator === -1) return;
      metadata[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
    });

    return [metadata, markdown.slice(end + 5).trim()];
  };

  const parseHeading = (line) => {
    const match = line.match(/^##\s+(?:\[([^\]]+)\]\s+)?(.+?)(?:\s+\{#([a-z0-9-]+)\})?$/i);
    if (!match) return null;

    const title = match[2].trim();
    return {
      label: match[1] || '',
      title,
      id: match[3] || slugify(title),
    };
  };

  const parseTable = (lines, start) => {
    const tableLines = [];
    let index = start;
    while (index < lines.length && /^\s*\|.+\|\s*$/.test(lines[index])) {
      tableLines.push(lines[index].trim());
      index += 1;
    }

    if (tableLines.length < 2 || !/^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(tableLines[1])) {
      return null;
    }

    const cellsFor = (line) => line.replace(/^\||\|$/g, '').split('|').map((cell) => inlineMarkdown(cell.trim()));
    const headers = cellsFor(tableLines[0]);
    const rows = tableLines.slice(2).map(cellsFor);

    const thead = `<thead><tr>${headers.map((cell) => `<th>${cell}</th>`).join('')}</tr></thead>`;
    const tbody = `<tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>`;

    return {
      html: `<div class="table-wrap"><table>${thead}${tbody}</table></div>`,
      next: index,
    };
  };

  const renderParagraph = (value) => {
    const definition = value.match(/^\*\*Definition:\*\*\s+(.+)$/);
    if (definition) {
      return `
        <div class="definition-card">
          <span class="definition-label">Definition</span>
          <p>${inlineMarkdown(definition[1])}</p>
        </div>
      `;
    }

    return `<p>${inlineMarkdown(value)}</p>`;
  };

  const renderImage = (line) => {
    const image = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if (!image) return null;

    return `
      <figure class="diagram">
        <img src="${escapeHtml(image[2])}" alt="${escapeHtml(image[1])}" loading="lazy">
      </figure>
    `;
  };

  const renderLabeledQuote = (quoteLines) => {
    const label = quoteLines[0].match(/^\*\*([^*]+):\*\*\s*(.*)$/);
    if (!label) {
      return `<blockquote>${inlineMarkdown(quoteLines.join(' '))}</blockquote>`;
    }

    const labelText = label[1];
    const firstBodyLine = label[2].trim();
    const bodyLines = firstBodyLine ? [firstBodyLine, ...quoteLines.slice(1)] : quoteLines.slice(1);

    if (labelText.toLowerCase() === 'examples') {
      const items = bodyLines
        .filter((line) => /^-\s+/.test(line))
        .map((line) => line.replace(/^-\s+/, ''));

      const body = items.length
        ? `<ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join('')}</ul>`
        : `<p>${inlineMarkdown(bodyLines.join(' '))}</p>`;

      return `
        <div class="examples-card">
          <span class="examples-label">Examples</span>
          ${body}
        </div>
      `;
    }

    return `<div class="callout"><span class="label">${inlineMarkdown(labelText)}</span>${inlineMarkdown(bodyLines.join(' '))}</div>`;
  };

  const renderBlocks = (markdown) => {
    const lines = markdown.split(/\r?\n/);
    const toc = [];
    const html = [];
    let index = 0;
    let sectionOpen = false;

    const closeSection = () => {
      if (sectionOpen) {
        html.push('</section>');
        sectionOpen = false;
      }
    };

    while (index < lines.length) {
      const line = lines[index];

      if (!line.trim()) {
        index += 1;
        continue;
      }

      const heading = parseHeading(line);
      if (heading) {
        closeSection();
        toc.push(heading);
        const sectionClass = heading.id === 'implications' ? ' class="implications"' : '';
        html.push(`<section id="${heading.id}"${sectionClass}>`);
        html.push(`<h2><span class="num">${inlineMarkdown(heading.label)}</span>${inlineMarkdown(heading.title)}</h2>`);
        sectionOpen = true;
        index += 1;
        continue;
      }

      if (line.startsWith('```')) {
        const codeLines = [];
        index += 1;
        while (index < lines.length && !lines[index].startsWith('```')) {
          codeLines.push(lines[index]);
          index += 1;
        }
        html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        index += 1;
        continue;
      }

      const image = renderImage(line.trim());
      if (image) {
        html.push(image);
        index += 1;
        continue;
      }

      const table = parseTable(lines, index);
      if (table) {
        html.push(table.html);
        index = table.next;
        continue;
      }

      if (/^>\s?/.test(line)) {
        const quoteLines = [];
        while (index < lines.length && /^>\s?/.test(lines[index])) {
          quoteLines.push(lines[index].replace(/^>\s?/, ''));
          index += 1;
        }
        html.push(renderLabeledQuote(quoteLines));
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (index < lines.length && /^-\s+/.test(lines[index])) {
          items.push(lines[index].replace(/^-\s+/, ''));
          index += 1;
        }
        html.push(`<ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join('')}</ul>`);
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
          items.push(lines[index].replace(/^\d+\.\s+/, ''));
          index += 1;
        }
        html.push(`<ol>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join('')}</ol>`);
        continue;
      }

      const paragraph = [];
      while (
        index < lines.length &&
        lines[index].trim() &&
        !parseHeading(lines[index]) &&
        !lines[index].startsWith('```') &&
        !renderImage(lines[index].trim()) &&
        !/^>\s?/.test(lines[index]) &&
        !/^-\s+/.test(lines[index]) &&
        !/^\d+\.\s+/.test(lines[index]) &&
        !parseTable(lines, index)
      ) {
        paragraph.push(lines[index].trim());
        index += 1;
      }
      html.push(renderParagraph(paragraph.join(' ')));
    }

    closeSection();
    return { html: html.join('\n'), toc };
  };

  const renderPage = (metadata, body) => {
    document.title = metadata.title ? metadata.title.replace(/\*/g, '') : document.title;
    const byline = metadata.author
      ? `<div class="byline">by ${inlineMarkdown(metadata.author)}</div>`
      : '';

    document.getElementById('masthead').innerHTML = `
      <div class="eyebrow">${formatWithDots(metadata.eyebrow || '')}</div>
      <h1 class="title">${inlineMarkdown(metadata.title || 'Taxonomy')}</h1>
      ${byline}
      <div class="audio-widget">
        <div class="audio-kicker">Listen to a podcast conversation exploring this document.</div>
        <audio controls preload="metadata" data-plyr-audio>
          <source src="${AUDIO_SOURCE}" type="audio/mp4">
        </audio>
      </div>
      <div class="title-rule"><span class="ornament"></span></div>
    `;
    setupAudioPlayer();

    const rendered = renderBlocks(body);
    document.getElementById('content').innerHTML = rendered.html;
    const tocGroupLabel = (entry) => {
      if (entry.label.toLowerCase() === 'preamble') return '';
      const group = entry.label.split('·')[1]?.trim() || '';
      return group === 'Agentic Construct' ? 'Agentic Constructs' : group;
    };
    const tocTitle = (entry) => inlineMarkdown(entry.title.replace(/^What This Document Is$/, 'What This Is'));
    const groupedToc = [];

    rendered.toc.forEach((entry) => {
      if (entry.label.toLowerCase() === 'preamble') {
        groupedToc.push(`<li class="toc-preamble"><a href="#${entry.id}" data-section="${entry.id}"><span class="toc-text">${tocTitle(entry)}</span></a></li>`);
        return;
      }

      const group = tocGroupLabel(entry);
      const last = groupedToc[groupedToc.length - 1];
      const number = `<span class="toc-num" aria-hidden="true">${escapeHtml(entry.label.split('·')[0].trim())}.</span>`;
      const item = `<li class="toc-entry"><a href="#${entry.id}" data-section="${entry.id}">${number}<span class="toc-text">${tocTitle(entry)}</span></a></li>`;

      if (last?.group === group) {
        last.items.push(item);
      } else {
        groupedToc.push({ group, items: [item] });
      }
    });

    document.getElementById('toc-list').innerHTML = groupedToc.map((entry) => {
      if (typeof entry === 'string') return entry;
      return `<li class="toc-group"><span class="toc-group-label">${escapeHtml(entry.group)}</span><ol>${entry.items.join('')}</ol></li>`;
    }).join('');
    document.getElementById('footer').innerHTML = formatWithDots(metadata.footer || '');

    activateScrollSpy();
  };

  const setupAudioPlayer = () => {
    const audio = document.querySelector('[data-plyr-audio]');
    if (!audio || !window.Plyr) return;

    new Plyr(audio, {
      controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'volume'],
    });
  };

  const activateScrollSpy = () => {
    const sections = document.querySelectorAll('section[id]');
    const tocLinks = document.querySelectorAll('.toc a[data-section]');
    if (!sections.length || !tocLinks.length) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          tocLinks.forEach(link => {
            link.classList.toggle('active', link.dataset.section === id);
          });
        }
      });
    }, {
      rootMargin: '-30% 0px -60% 0px',
      threshold: 0
    });

    sections.forEach(s => observer.observe(s));
  };

  fetch(MARKDOWN_SOURCE, { cache: 'no-cache' })
    .then((response) => {
      if (!response.ok) {
        throw new Error(`Could not load ${MARKDOWN_SOURCE}: ${response.status}`);
      }
      return response.text();
    })
    .then((markdown) => {
      const [metadata, body] = parseFrontMatter(markdown);
      renderPage(metadata, body);
    })
    .catch((error) => {
      document.getElementById('content').innerHTML = `
        <p class="load-error">
          ${escapeHtml(error.message)}. Serve this directory over HTTP so taxonomy.html can fetch taxonomy.md.
        </p>
      `;
    });
</script>

</body>
</html>
