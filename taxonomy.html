<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Mechanical Agentic Taxonomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Source+Serif+4:opsz,wght@8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F1;
    --bg-deep: #F2EDE3;
    --text: #1C1A17;
    --text-muted: #76706A;
    --text-subtle: #A39C92;
    --accent: #7A2E1E;
    --accent-soft: #B0584A;
    --rule: #DDD5C8;
    --rule-soft: #EAE4D8;
    --code-bg: #F2ECE0;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Source Serif 4', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    --measure: 45rem;
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.7;
    font-feature-settings: "onum" 1, "kern" 1, "liga" 1;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* Subtle paper grain */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* Layout */
  .page {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 1fr) min(var(--measure), 100% - 3rem) minmax(0, 1fr);
    padding: 4.5rem 0 8rem;
  }
  .page > * { grid-column: 2; }
  .loading,
  .load-error {
    font-family: var(--font-display);
    color: var(--text-muted);
    text-align: center;
  }

  /* Sticky TOC sidebar - desktop only */
  .toc {
    position: fixed;
    top: 4.5rem;
    left: 2rem;
    width: 12rem;
    font-family: var(--font-display);
    font-size: 0.78rem;
    line-height: 1.55;
    letter-spacing: 0.04em;
    font-feature-settings: "smcp" 1;
    color: var(--text-muted);
    display: none;
  }
  .toc-label {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-subtle);
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }
  .toc ol {
    list-style: none;
    padding: 0;
    margin: 0;
    counter-reset: toc;
  }
  .toc li {
    counter-increment: toc;
    margin: 0.6rem 0;
    position: relative;
    padding-left: 2.8rem;
    line-height: 1.4;
  }
  .toc li::before {
    content: counter(toc, upper-roman) ".";
    position: absolute;
    left: 0;
    width: 2.2rem;
    text-align: right;
    color: var(--text-subtle);
    font-feature-settings: "lnum" 1;
    font-style: italic;
    font-weight: 400;
  }
  .toc li.toc-preamble {
    counter-increment: none;
    padding-left: 0;
  }
  .toc li.toc-preamble::before {
    display: none;
  }
  .toc a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
    border-bottom: 1px solid transparent;
  }
  .toc a:hover { color: var(--accent); }
  .toc a.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  @media (min-width: 1180px) {
    .toc { display: block; }
  }

  /* Masthead */
  .masthead {
    text-align: center;
    margin-bottom: 5rem;
    animation: fade-up 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 2.5rem;
    font-weight: 400;
  }
  .eyebrow .dot {
    display: inline-block;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    vertical-align: middle;
    margin: 0 0.85em;
    transform: translateY(-1px);
  }
  h1.title {
    font-family: var(--font-display);
    font-size: clamp(2.75rem, 6vw, 4rem);
    font-weight: 380;
    font-style: normal;
    font-variation-settings: "opsz" 144, "SOFT" 50;
    line-height: 1;
    letter-spacing: -0.022em;
    margin: 0 0 1.5rem;
    color: var(--text);
    text-wrap: balance;
  }
  h1.title em {
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100;
    color: var(--accent);
  }
  .subtitle {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--text-muted);
    max-width: 30rem;
    margin: 0 auto;
    line-height: 1.5;
  }
  .title-rule {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 3rem auto 0;
    width: 8rem;
  }
  .title-rule::before,
  .title-rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .title-rule .ornament {
    width: 5px;
    height: 5px;
    background: var(--accent);
    margin: 0 0.85rem;
    transform: rotate(45deg);
  }

  /* Section structure */
  section {
    margin-bottom: 4rem;
    animation: fade-up 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  section:nth-child(n+3) { animation-delay: 0.05s; }

  h2 {
    font-family: var(--font-display);
    font-size: 1.85rem;
    font-weight: 480;
    font-variation-settings: "opsz" 72, "SOFT" 30;
    letter-spacing: -0.012em;
    line-height: 1.15;
    margin: 0 0 1.5rem;
    color: var(--text);
    position: relative;
  }
  h2 .num {
    display: block;
    font-family: var(--font-display);
    font-size: 0.7rem;
    font-weight: 400;
    font-style: italic;
    font-variation-settings: "opsz" 9;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.7rem;
    font-feature-settings: "lnum" 1;
  }

  p {
    margin: 0 0 1.25rem;
    hanging-punctuation: first last;
  }
  p:last-child { margin-bottom: 0; }

  /* Normalize inter-section spacing regardless of what element ends the section */
  section > *:last-child { margin-bottom: 0; }

  .definition-card {
    margin: 0 0 1.8rem;
    padding: 1.15rem 1.35rem 1.25rem;
    background: var(--bg-deep);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
  }
  .definition-card .definition-label {
    display: block;
    margin-bottom: 0.45rem;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 0.66rem;
    font-style: normal;
    font-feature-settings: "smcp" 1, "lnum" 1;
    letter-spacing: 0.2em;
    line-height: 1;
    text-transform: uppercase;
  }
  .definition-card p {
    margin: 0;
    color: var(--text);
    font-size: 1.02rem;
    font-style: italic;
    line-height: 1.6;
  }

  /* Drop cap on first paragraph of What This Document Is */
  #what-this-is > p:first-of-type::first-letter {
    font-family: var(--font-display);
    font-size: 4.2rem;
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 70;
    float: left;
    line-height: 0.85;
    padding: 0.35rem 0.6rem 0 0;
    color: var(--accent);
  }

  em { font-style: italic; }
  strong {
    font-weight: 600;
    color: var(--text);
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
    transition: border-color 0.2s ease;
  }
  a:hover { border-bottom-color: var(--accent); }

  /* Lists */
  ul, ol {
    margin: 0 0 1.5rem;
    padding-left: 1.4rem;
  }
  ul { list-style: none; padding-left: 0; }
  ul li {
    position: relative;
    padding-left: 1.4rem;
    margin-bottom: 0.85rem;
  }
  ul li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.85em;
    width: 0.45rem;
    height: 1px;
    background: var(--accent);
  }
  ol {
    list-style: none;
    counter-reset: ol;
    padding-left: 0;
  }
  ol li {
    counter-increment: ol;
    position: relative;
    padding-left: 2.2rem;
    margin-bottom: 0.85rem;
  }
  ol li::before {
    content: counter(ol);
    position: absolute;
    left: 0;
    top: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-variation-settings: "opsz" 14, "SOFT" 60;
    font-feature-settings: "lnum" 1;
    color: var(--accent);
    font-size: 0.95rem;
    width: 1.5rem;
    text-align: right;
  }

  /* Code blocks */
  pre {
    background: var(--code-bg);
    border-left: 2px solid var(--accent);
    padding: 1.3rem 1.5rem;
    margin: 2rem 0;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--text);
    border-radius: 0;
    position: relative;
  }
  pre .comment { color: var(--text-muted); font-style: italic; }
  pre .placeholder { color: var(--accent); }
  pre .keyword { color: var(--text); font-weight: 500; }
  pre .string { color: var(--accent-soft); }

  code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 0.08em 0.35em;
    border-radius: 2px;
    color: var(--text);
  }

  /* Table */
  .table-wrap {
    margin: 2rem -1rem;
    padding: 0 1rem;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }
  thead th {
    font-family: var(--font-display);
    font-weight: 500;
    font-variation-settings: "opsz" 14;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: left;
    padding: 0.85rem 1rem 0.85rem 0;
    border-bottom: 1.5px solid var(--text);
    color: var(--text);
  }
  thead th:not(:last-child) { padding-right: 1.5rem; }
  tbody td {
    padding: 1rem 1rem 1rem 0;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    line-height: 1.5;
  }
  tbody td:not(:last-child) { padding-right: 1.5rem; }
  tbody tr:last-child td { border-bottom: 1.5px solid var(--text); }
  td:first-child, th:first-child {
    font-family: var(--font-display);
    font-weight: 500;
    font-variation-settings: "opsz" 24;
  }

  /* Block elements */
  .callout {
    margin: 2rem 0;
    padding: 1.5rem 1.75rem;
    background: var(--bg-deep);
    border-left: 2px solid var(--accent);
    font-style: italic;
    font-size: 0.98rem;
    color: var(--text);
  }
  .callout .label {
    display: block;
    font-style: normal;
    font-family: var(--font-display);
    font-size: 0.66rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
    font-feature-settings: "lnum" 1;
  }

  /* Section divider - between major parts (unused) */
  .divider {
    text-align: center;
    margin: 4rem 0;
    color: var(--text-subtle);
    font-family: var(--font-display);
    letter-spacing: 1em;
    font-size: 0.7rem;
  }

  /* Implications get special treatment */
  .implications ul li {
    padding-left: 0;
    margin-bottom: 1.5rem;
  }
  .implications ul li::before { display: none; }
  .implications ul li strong {
    display: block;
    font-family: var(--font-display);
    font-weight: 500;
    font-variation-settings: "opsz" 18;
    font-size: 1.08rem;
    color: var(--accent);
    margin-bottom: 0.35rem;
    letter-spacing: -0.005em;
  }

  /* Footer */
  footer {
    margin-top: 7rem;
    padding-top: 2.5rem;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-subtle);
  }
  footer .dot {
    display: inline-block;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    vertical-align: middle;
    margin: 0 0.85em;
    transform: translateY(-1px);
  }

  /* Animations */
  @keyframes fade-up {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Selection */
  ::selection {
    background: var(--accent);
    color: var(--bg);
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    html { scroll-behavior: auto; }
  }

  /* Print */
  @media print {
    body { background: white; }
    body::before { display: none; }
    .toc { display: none; }
    pre { border-left-color: #888; }
  }
</style>
</head>
<body>

<nav class="toc" aria-label="Table of contents">
  <div class="toc-label">Contents</div>
  <ol id="toc-list"></ol>
</nav>

<div class="page">
  <header class="masthead" id="masthead"></header>
  <main id="content" aria-live="polite">
    <p class="loading">Loading taxonomy.md...</p>
  </main>
  <footer id="footer"></footer>
</div>

<script>
  const MARKDOWN_SOURCE = 'taxonomy.md';

  const escapeHtml = (value) => value
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

  const slugify = (value) => value
    .toLowerCase()
    .replace(/<[^>]*>/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');

  const formatWithDots = (value) => escapeHtml(value)
    .split(/\s+•\s+/)
    .join(' <span class="dot"></span> ');

  const inlineMarkdown = (value) => {
    const code = [];
    let html = escapeHtml(value).replace(/`([^`]+)`/g, (_, match) => {
      code.push(`<code>${match}</code>`);
      return `@@CODE${code.length - 1}@@`;
    });

    html = html
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');

    return html.replace(/@@CODE(\d+)@@/g, (_, index) => code[Number(index)]);
  };

  const parseFrontMatter = (markdown) => {
    if (!markdown.startsWith('---\n')) {
      return [{}, markdown];
    }

    const end = markdown.indexOf('\n---\n', 4);
    if (end === -1) {
      return [{}, markdown];
    }

    const metadata = {};
    markdown.slice(4, end).split('\n').forEach((line) => {
      const separator = line.indexOf(':');
      if (separator === -1) return;
      metadata[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
    });

    return [metadata, markdown.slice(end + 5).trim()];
  };

  const parseHeading = (line) => {
    const match = line.match(/^##\s+(?:\[([^\]]+)\]\s+)?(.+?)(?:\s+\{#([a-z0-9-]+)\})?$/i);
    if (!match) return null;

    const title = match[2].trim();
    return {
      label: match[1] || '',
      title,
      id: match[3] || slugify(title),
    };
  };

  const parseTable = (lines, start) => {
    const tableLines = [];
    let index = start;
    while (index < lines.length && /^\s*\|.+\|\s*$/.test(lines[index])) {
      tableLines.push(lines[index].trim());
      index += 1;
    }

    if (tableLines.length < 2 || !/^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(tableLines[1])) {
      return null;
    }

    const cellsFor = (line) => line.replace(/^\||\|$/g, '').split('|').map((cell) => inlineMarkdown(cell.trim()));
    const headers = cellsFor(tableLines[0]);
    const rows = tableLines.slice(2).map(cellsFor);

    const thead = `<thead><tr>${headers.map((cell) => `<th>${cell}</th>`).join('')}</tr></thead>`;
    const tbody = `<tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>`;

    return {
      html: `<div class="table-wrap"><table>${thead}${tbody}</table></div>`,
      next: index,
    };
  };

  const renderParagraph = (value) => {
    const definition = value.match(/^\*\*Definition:\*\*\s+(.+)$/);
    if (definition) {
      return `
        <div class="definition-card">
          <span class="definition-label">Definition</span>
          <p>${inlineMarkdown(definition[1])}</p>
        </div>
      `;
    }

    return `<p>${inlineMarkdown(value)}</p>`;
  };

  const renderBlocks = (markdown) => {
    const lines = markdown.split(/\r?\n/);
    const toc = [];
    const html = [];
    let index = 0;
    let sectionOpen = false;

    const closeSection = () => {
      if (sectionOpen) {
        html.push('</section>');
        sectionOpen = false;
      }
    };

    while (index < lines.length) {
      const line = lines[index];

      if (!line.trim()) {
        index += 1;
        continue;
      }

      const heading = parseHeading(line);
      if (heading) {
        closeSection();
        toc.push(heading);
        const sectionClass = heading.id === 'implications' ? ' class="implications"' : '';
        html.push(`<section id="${heading.id}"${sectionClass}>`);
        html.push(`<h2><span class="num">${inlineMarkdown(heading.label)}</span>${inlineMarkdown(heading.title)}</h2>`);
        sectionOpen = true;
        index += 1;
        continue;
      }

      if (line.startsWith('```')) {
        const codeLines = [];
        index += 1;
        while (index < lines.length && !lines[index].startsWith('```')) {
          codeLines.push(lines[index]);
          index += 1;
        }
        html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        index += 1;
        continue;
      }

      const table = parseTable(lines, index);
      if (table) {
        html.push(table.html);
        index = table.next;
        continue;
      }

      if (/^>\s?/.test(line)) {
        const quoteLines = [];
        while (index < lines.length && /^>\s?/.test(lines[index])) {
          quoteLines.push(lines[index].replace(/^>\s?/, ''));
          index += 1;
        }
        const quote = quoteLines.join(' ');
        const callout = quote.match(/^\*\*([^*]+):\*\*\s*(.+)$/);
        if (callout) {
          html.push(`<div class="callout"><span class="label">${inlineMarkdown(callout[1])}</span>${inlineMarkdown(callout[2])}</div>`);
        } else {
          html.push(`<blockquote>${inlineMarkdown(quote)}</blockquote>`);
        }
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (index < lines.length && /^-\s+/.test(lines[index])) {
          items.push(lines[index].replace(/^-\s+/, ''));
          index += 1;
        }
        html.push(`<ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join('')}</ul>`);
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
          items.push(lines[index].replace(/^\d+\.\s+/, ''));
          index += 1;
        }
        html.push(`<ol>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join('')}</ol>`);
        continue;
      }

      const paragraph = [];
      while (
        index < lines.length &&
        lines[index].trim() &&
        !parseHeading(lines[index]) &&
        !lines[index].startsWith('```') &&
        !/^>\s?/.test(lines[index]) &&
        !/^-\s+/.test(lines[index]) &&
        !/^\d+\.\s+/.test(lines[index]) &&
        !parseTable(lines, index)
      ) {
        paragraph.push(lines[index].trim());
        index += 1;
      }
      html.push(renderParagraph(paragraph.join(' ')));
    }

    closeSection();
    return { html: html.join('\n'), toc };
  };

  const renderPage = (metadata, body) => {
    document.title = metadata.title ? metadata.title.replace(/\*/g, '') : document.title;

    document.getElementById('masthead').innerHTML = `
      <div class="eyebrow">${formatWithDots(metadata.eyebrow || '')}</div>
      <h1 class="title">${inlineMarkdown(metadata.title || 'Taxonomy')}</h1>
      <div class="title-rule"><span class="ornament"></span></div>
    `;

    const rendered = renderBlocks(body);
    document.getElementById('content').innerHTML = rendered.html;
    document.getElementById('toc-list').innerHTML = rendered.toc.map((entry) => {
      const className = entry.label.toLowerCase() === 'preamble' ? ' class="toc-preamble"' : '';
      return `<li${className}><a href="#${entry.id}" data-section="${entry.id}">${inlineMarkdown(entry.title.replace(/^What This Document Is$/, 'What This Is'))}</a></li>`;
    }).join('');
    document.getElementById('footer').innerHTML = formatWithDots(metadata.footer || '');

    activateScrollSpy();
  };

  const activateScrollSpy = () => {
    const sections = document.querySelectorAll('section[id]');
    const tocLinks = document.querySelectorAll('.toc a[data-section]');
    if (!sections.length || !tocLinks.length) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          tocLinks.forEach(link => {
            link.classList.toggle('active', link.dataset.section === id);
          });
        }
      });
    }, {
      rootMargin: '-30% 0px -60% 0px',
      threshold: 0
    });

    sections.forEach(s => observer.observe(s));
  };

  fetch(MARKDOWN_SOURCE, { cache: 'no-cache' })
    .then((response) => {
      if (!response.ok) {
        throw new Error(`Could not load ${MARKDOWN_SOURCE}: ${response.status}`);
      }
      return response.text();
    })
    .then((markdown) => {
      const [metadata, body] = parseFrontMatter(markdown);
      renderPage(metadata, body);
    })
    .catch((error) => {
      document.getElementById('content').innerHTML = `
        <p class="load-error">
          ${escapeHtml(error.message)}. Serve this directory over HTTP so taxonomy.html can fetch taxonomy.md.
        </p>
      `;
    });
</script>

</body>
</html>
